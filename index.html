<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brocha &amp; Latón · Barbería clásica en Valencia</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
  </head>
  <body>
    <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>

    <header class="cabecera">
      <div class="contenedor">
        <a class="cabecera__marca" href="#inicio">Brocha &amp; Latón</a>
        <nav aria-label="Principal">
          <ul>
            <li><a href="#servicios">Servicios</a></li>
            <li><a href="#galeria">Trabajos</a></li>
            <li><a href="#nosotros">Nosotros</a></li>
            <li><a href="#horario">Horario</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="contenido">
      <section id="inicio" class="seccion seccion--oscura" aria-labelledby="titulo-inicio">
        <div class="contenedor">
          <h1 id="titulo-inicio">Brocha &amp; Latón</h1>
        </div>
      </section>

      <section id="servicios" class="seccion" aria-labelledby="titulo-servicios">
        <div class="contenedor">
          <h2 id="titulo-servicios" class="seccion__titulo">Servicios y precios</h2>
        </div>
      </section>

      <section id="galeria" class="seccion seccion--alterna" aria-labelledby="titulo-galeria">
        <div class="contenedor">
          <h2 id="titulo-galeria" class="seccion__titulo">Nuestros trabajos</h2>
        </div>
      </section>

      <section id="nosotros" class="seccion" aria-labelledby="titulo-nosotros">
        <div class="contenedor">
          <h2 id="titulo-nosotros" class="seccion__titulo">Sobre nosotros</h2>
        </div>
      </section>

      <section id="resenas" class="seccion seccion--alterna" aria-labelledby="titulo-resenas">
        <div class="contenedor">
          <h2 id="titulo-resenas" class="seccion__titulo">Lo que dicen nuestros clientes</h2>
        </div>
      </section>

      <section id="horario" class="seccion seccion--oscura" aria-labelledby="titulo-horario">
        <div class="contenedor">
          <h2 id="titulo-horario" class="seccion__titulo">Horario y ubicación</h2>
        </div>
      </section>
    </main>

    <footer class="pie">
      <div class="contenedor">
        <p>Brocha &amp; Latón es un negocio ficticio de demostración.</p>
      </div>
    </footer>
  </body>
</html>
